name: Bug Report
description: Report a bug in JARVIS
labels: [bug]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
      placeholder: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Arch)
        - Linux (Other)
        - Windows 11
        - Windows 10
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: JARVIS version
      placeholder: "e.g., 0.1.0"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant logs (check DevTools console)
      render: shell
