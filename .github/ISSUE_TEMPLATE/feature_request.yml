name: Feature Request
description: Suggest a new feature for JARVIS
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
      placeholder: I want to be able to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard UI
        - Machine management
        - Task dispatch
        - Session monitoring
        - GitHub integration
        - Pipelines
        - Setup / Config
        - Other
